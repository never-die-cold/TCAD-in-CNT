name = "cui2023_p_cnt_network_topgate"
calibration_status = "tcad_zero_dose_aligned_compact_metrics"
source_data = "data/literature/cui2023_topgate"
dose_unit = "krad(Si)"
doses_krad = [0, 200, 500, 1000, 2000, 3000]

# Every non-reported value is an explicit assumption with a stated range; the
# provenance rows live in data/literature/cui2023_topgate/device_parameters.csv.
# Alignment knobs: gate_workfunction_ev -> |Vth|, cnt_nc300/nv300 + interface
# states -> SS, mobilities -> Gm.  Ranges are swept during zero-dose alignment.

[run]
name = "zero_dose"
dose_krad = 0.0
fixed_charge_cm2 = 0.0
# Pre-existing interface states, derived from the digitized zero-dose swing:
# SS0 = 207.95 mV/dec -> n0 = SS0/59.6 = 3.49 -> q*Dit/Cox = n0 - 1
# -> Dit = 2.49 * 1.33e-6 F/cm2 / 1.6e-19 C = 2.1e13 cm-2 eV-1.
# Range 1e13 - 3e13; Traps syntax checked against the W-2024.09 manual.
interface_dit_cm2ev = 2.1e13
# Amphoteric uniform distributions relative to midgap for Eg = 0.5 eV:
# donor -0.25..0 eV and acceptor 0..0.25 eV.
interface_donor_energy_mid_ev = -0.125
interface_acceptor_energy_mid_ev = 0.125
interface_trap_energy_width_ev = 0.25
temperature_k = 300.0

[geometry]
gate_length_um = 4.0
gate_width_um = 30.0
top_dielectric_thickness_um = 0.010
buried_oxide_thickness_um = 0.280
# P0 registry assumption: effective CNT network film, 2-10 nm.
channel_thickness_um = 0.005
# Symmetric contact extensions; paper Figure 1 does not state them.
source_extension_um = 2.0
drain_extension_um = 2.0
# Reported 500 um substrate truncated: the backgate electrode at the bottom
# makes the silicon below it electrostatically irrelevant; kept at 2 um only
# for a well-conditioned mesh.
substrate_thickness_um = 2.0

[material]
# The film must act as the equipotential sheet the compact model assumes:
# with tox/eps_top = 0.010/15, the series correction t_cnt/eps_cnt must stay
# well under 10 % -> eps_cnt >= 0.005/(0.1*6.67e-4) ~ 75.  Range 40-120.
cnt_permittivity = 80.0
# Eg ~ 0.7/d[nm] eV for 1-2 nm semiconducting tubes, diluted by the metallic
# third of the network.  Range 0.3-0.9.
cnt_bandgap_ev = 0.5
# CNT electron affinity, graphene-like.  Range 4.3-4.8.
cnt_electron_affinity_ev = 4.5
# 1D tube DOS g/(2*pi*hbar*vF) ~ 6e6 eV-1 cm-1 (vF = 8e7 cm/s, degeneracy 2),
# spread over the tube diameter 1.5 nm -> ~4e20 eV-1 cm-3; integrating kT
# around the band edge gives the standard Nc/Nv form ~5e18 cm-3.  Range
# 1e18 - 2e19 (sets SS together with the interface states).
cnt_nc300_cm3 = 5e18
cnt_nv300_cm3 = 5e18
# Hole mobility is the P0 model-inverted zero-dose value (Vds = 0.1 V).
# Electron mobility is unmeasured; symmetric-complement assumption, ratio 0.5-2.
electron_mobility_cm2_vs = 21.4
hole_mobility_cm2_vs = 21.4
# Constant SRH lifetimes; W-2024.09 SDevice User Guide Table 87 defaults.
electron_srh_lifetime_s = 1e-5
hole_srh_lifetime_s = 3e-6
# Same series-equivalent Y2O3/HfO2 value as the P0 registry assumption.
top_dielectric_permittivity = 15.0
# Midgap potential of the film is chi + Eg/2 = 4.75 eV. Higher gate
# workfunction reduces |Vth| for this p-FET. Paper gate metal is unconfirmed;
# this is the primary |Vth| alignment knob. Range 4.1-5.2.
gate_workfunction_ev = 4.95
# Pd source/drain workfunction; paper reports Pd Ohmic contacts, not its value.
# High workfunction gives hole injection into the effective CNT film. Range 4.8-5.4.
source_drain_workfunction_ev = 5.1
# Effective acceptor doping in the Pd-contacted, ungated extensions only.
# The gated channel remains undoped. Alignment range 1e18-1e21 cm-3.
source_drain_doping_cm3 = 3e19

[bias]
source_v = 0.0
drain_v = -0.1
gate_initial_v = 0.5
gate_final_v = -2.0
backgate_v = 0.0

[mesh]
global_max_um = 0.5
global_min_um = 0.02
channel_max_um = 0.05
channel_min_um = 0.001
