# Illustrative, UNCALIBRATED baseline. Dose is absorbed dose in the oxide.
name = "cntfet_inverter_tid_baseline"
vdd_v = 0.8
temperature_k = 300.0
dose_unit = "krad(SiO2)"
doses_krad = [0, 100, 300, 500, 1000]
transfer_points = 401
inverter_points = 1001
calibration_status = "illustrative_uncalibrated"

[n_device]
polarity = "n"
width_um = 1.0
length_nm = 50.0
oxide_thickness_nm = 10.0
oxide_relative_permittivity = 3.9
mobility_m2_vs = 0.02
threshold_v = 0.25
slope_factor = 1.3
channel_length_modulation = 0.02
qot_slope_c_cm2_per_krad = 1.0e-11
qit_slope_c_cm2_per_krad = 2.0e-12
mobility_degradation_per_krad = 2.0e-4
slope_factor_per_krad = 5.0e-5

[p_device]
polarity = "p"
width_um = 1.0
length_nm = 50.0
oxide_thickness_nm = 10.0
oxide_relative_permittivity = 3.9
mobility_m2_vs = 0.02
threshold_v = 0.25
slope_factor = 1.3
channel_length_modulation = 0.02
qot_slope_c_cm2_per_krad = 8.0e-12
qit_slope_c_cm2_per_krad = 2.0e-12
mobility_degradation_per_krad = 2.0e-4
slope_factor_per_krad = 5.0e-5
